      <animate attributeName="stroke-dashoffset" values="1;1;0;0;1;1" keyTimes="0;0.020;0.180;0.92;0.97;1" dur="10s" repeatCount="indefinite"/>
    </path>
    <circle cx="256" cy="133" r="6" fill="#e07a3f" stroke="#3b2f2f" stroke-width="2"/>
    <text x="270" y="117" font-size="17" font-weight="700">Game Dev &amp; Engines</text>
