<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" role="img" aria-label="Goood skill tree">
  <title>Goood skill tree</title>
  <defs>
    <style>
      .doodle-font {
        font-family: 'Bradley Hand', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', 'Comic Sans MS', cursive, sans-serif;
        fill: #3b2f2f;
      }
      .tag-font {
        font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Bradley Hand', monospace;
        font-size: 12.5px;
        fill: #3b2f2f;
      }
    </style>
    <filter id="doodle" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="2" result="n">
        <animate attributeName="seed" values="2;5;9;4;7" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#3b2f2f" stroke-opacity="0.28" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Warm Cream Doodle Card -->
  <rect x="2" y="2" width="976" height="596" rx="18" fill="#fbf6ea" stroke="#3b2f2f" stroke-width="2.5" filter="url(#doodle)"/>

  <text x="34" y="46" class="doodle-font" font-size="26" font-weight="700">skill tree</text>
  <text x="34" y="68" class="doodle-font" font-size="14" opacity="0.7">read left to right. bar = how much I reach for it, branching into my active toolkit</text>

  <g filter="url(#doodle)" class="doodle-font">
    <!-- Origin Node Circle on the Left -->
    <circle cx="78" cy="345" r="46" fill="#fff2c9" stroke="#3b2f2f" stroke-width="3"/>
    <text x="78" y="343" text-anchor="middle" font-size="19" font-weight="700">Goood</text>
    <text x="78" y="362" text-anchor="middle" font-size="12">@ CMKL</text>

    <!-- 1. Orange Dot: Game Dev & Engines (85% -> 212.5px) | C#, Unity -->
