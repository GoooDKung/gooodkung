<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 370" width="980" height="370" role="img" aria-label="AI usage meter">
  <title>AI usage meter</title>
  <defs>
    <style>
      .doodle-font {
        font-family: 'Bradley Hand', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', 'Comic Sans MS', cursive, sans-serif;
        fill: #3b2f2f;
      }
    </style>
    <filter id="doodle" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="2" result="n">
        <animate attributeName="seed" values="2;5;9;4;7" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#3b2f2f" stroke-opacity="0.28" stroke-width="2"/>
    </pattern>
  </defs>

  <rect x="2" y="2" width="976" height="366" rx="18" fill="#fbf6ea" stroke="#3b2f2f" stroke-width="2.5" filter="url(#doodle)"/>
  <text x="34" y="46" class="doodle-font" font-size="26" font-weight="700">daily driver meter</text>
  <text x="34" y="68" class="doodle-font" font-size="14" opacity="0.7">how much each model gets used for my coding. totally scientific</text>

  <g filter="url(#doodle)" class="doodle-font">
    <!-- Vertical Dashed 0% Baseline Marker -->
    <line x1="230" y1="104" x2="230" y2="352" stroke="#3b2f2f" stroke-width="3" stroke-dasharray="6 6"/>

    <!-- Row 1: Claude | 100% (560px) | (Architecture & heavy lifting) -->
    <text x="73" y="120" font-size="19" font-weight="700">Claude</text>
    <text x="244" y="120" font-size="14" opacity="0.68">(Architecture &amp; heavy lifting)</text>
    <rect x="73" y="128" width="717" height="22" rx="11" fill="#fff" stroke="#3b2f2f" stroke-width="2" stroke-opacity="0.45"/>
    <rect x="230" y="128" height="22" rx="11" fill="#e07a3f" stroke="#3b2f2f" stroke-width="2.5" width="560">
      <animate attributeName="width" values="0;0;560;560;0;0" keyTimes="0;0.030;0.230;0.92;0.97;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect x="230" y="128" height="22" rx="11" fill="url(#hatch)" width="560">
      <animate attributeName="width" values="0;0;560;560;0;0" keyTimes="0;0.030;0.230;0.92;0.97;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <text x="804" y="145" font-size="16">100%
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.230;0.270;0.92;0.97;1" dur="10s" repeatCount="indefinite"/>
    </text>

    <!-- Row 2: Gemini | 45% (252px) | (Project data digging) -->
    <text x="73" y="184" font-size="19" font-weight="700">Gemini</text>
    <text x="244" y="184" font-size="14" opacity="0.68">(Project data digging)</text>
    <rect x="73" y="192" width="717" height="22" rx="11" fill="#fff" stroke="#3b2f2f" stroke-width="2" stroke-opacity="0.45"/>
    <rect x="230" y="192" height="22" rx="11" fill="#3f7fbf" stroke="#3b2f2f" stroke-width="2.5" width="252">
      <animate attributeName="width" values="0;0;252;252;0;0" keyTimes="0;0.100;0.300;0.92;0.97;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect x="230" y="192" height="22" rx="11" fill="url(#hatch)" width="252">
      <animate attributeName="width" values="0;0;252;252;0;0" keyTimes="0;0.100;0.300;0.92;0.97;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <text x="496" y="209" font-size="16">45%
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.300;0.340;0.92;0.97;1" dur="10s" repeatCount="indefinite"/>
    </text>

    <!-- Row 3: Qwen | 35% (196px) | (Local multi-agent runtimes) -->
    <text x="73" y="248" font-size="19" font-weight="700">Qwen</text>
    <text x="244" y="248" font-size="14" opacity="0.68">(Local multi-agent runtimes)</text>
    <rect x="73" y="256" width="717" height="22" rx="11" fill="#fff" stroke="#3b2f2f" stroke-width="2" stroke-opacity="0.45"/>
    <rect x="230" y="256" height="22" rx="11" fill="#7a5bb5" stroke="#3b2f2f" stroke-width="2.5" width="196">
      <animate attributeName="width" values="0;0;196;196;0;0" keyTimes="0;0.170;0.370;0.92;0.97;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect x="230" y="256" height="22" rx="11" fill="url(#hatch)" width="196">
      <animate attributeName="width" values="0;0;196;196;0;0" keyTimes="0;0.170;0.370;0.92;0.97;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="273" font-size="16">35%
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.370;0.410;0.92;0.97;1" dur="10s" repeatCount="indefinite"/>
    </text>

    <!-- Row 4: ChatGPT | -20% (112px LEFT of x=230 -> x=118..230) | (Personal banter / skill issue) -->
    <text x="73" y="312" font-size="19" font-weight="700">ChatGPT</text>
    <text x="244" y="312" font-size="14" opacity="0.68">(Personal banter / skill issue)</text>
    <rect x="73" y="320" width="717" height="22" rx="11" fill="#fff" stroke="#3b2f2f" stroke-width="2" stroke-opacity="0.45"/>
    <rect x="118" y="320" height="22" rx="11" fill="#c0392b" stroke="#3b2f2f" stroke-width="2.5" width="112">
      <animate attributeName="x" values="230;230;118;118;230;230" keyTimes="0;0.240;0.440;0.92;0.97;1" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="width" values="0;0;112;112;0;0" keyTimes="0;0.240;0.440;0.92;0.97;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect x="118" y="320" height="22" rx="11" fill="url(#hatch)" width="112">
      <animate attributeName="x" values="230;230;118;118;230;230" keyTimes="0;0.240;0.440;0.92;0.97;1" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="width" values="0;0;112;112;0;0" keyTimes="0;0.240;0.440;0.92;0.97;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <text x="246" y="337" font-size="16">-20%
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.440;0.480;0.92;0.97;1" dur="10s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
