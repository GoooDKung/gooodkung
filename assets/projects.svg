<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" role="img" aria-label="Goood featured projects">
  <title>Goood featured projects</title>
  <defs>
    <style>
      .doodle-font {
        font-family: 'Chalkboard SE', 'Marker Felt', 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive, sans-serif;
        fill: #3b2f2f;
        text-rendering: geometricPrecision;
      }
      .card-title {
        font-family: 'Chalkboard SE', 'Marker Felt', 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive, sans-serif;
        font-weight: 700;
        fill: #ffffff;
        text-rendering: geometricPrecision;
      }
      .scene-label {
        font-family: 'SF Mono', 'JetBrains Mono', 'Menlo', 'Consolas', monospace;
        font-size: 11px;
        font-weight: 700;
        fill: #ffffff;
        opacity: 0.92;
      }
      .tag-text {
        font-family: 'Chalkboard SE', 'Marker Felt', 'Segoe Print', 'Bradley Hand', cursive, sans-serif;
        font-size: 12.5px;
        font-weight: 600;
        fill: #3b2f2f;
      }
    </style>
    <filter id="doodle" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="2" result="n">
        <animate attributeName="seed" values="2;5;9;4;7" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#3b2f2f" stroke-opacity="0.24" stroke-width="2"/>
    </pattern>
  </defs>

  <rect x="2" y="2" width="976" height="536" rx="18" fill="#fbf6ea" stroke="#3b2f2f" stroke-width="2.5" filter="url(#doodle)"/>
  <text x="34" y="46" class="doodle-font" font-size="26" font-weight="700">now showing</text>
  <text x="34" y="68" class="doodle-font" font-size="14.5" opacity="0.75">six features currently in production</text>

  <!-- Card 1: Aberration -->
  <g transform="rotate(-1.2 179.0 192.0)">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.030;0.110;0.92;0.97;1" dur="10s" repeatCount="indefinite"/>
    <g filter="url(#doodle)">
      <rect x="34" y="92" width="290" height="200" rx="12" fill="#fff" stroke="#3b2f2f" stroke-width="2.5"/>
      <rect x="34" y="92" width="290" height="44" rx="12" fill="#e07a3f" stroke="#3b2f2f" stroke-width="2.5"/>
      <rect x="34" y="92" width="290" height="44" rx="12" fill="url(#hatch)"/>
      <rect x="48" y="252" width="210" height="26" rx="13" fill="#e07a3f" fill-opacity="0.2" stroke="#3b2f2f" stroke-width="2"/>
    </g>
    <text x="48" y="120" font-size="18.5" class="card-title">Aberration</text>
    <text x="312" y="120" text-anchor="end" class="scene-label">SCENE 01</text>
    <text x="48" y="158" class="doodle-font" font-size="13" opacity="0.68">BoomerMcShooter</text>
    <text x="48" y="184" class="doodle-font" font-size="13.5">Underground boomer shooter with</text>
    <text x="48" y="204" class="doodle-font" font-size="13.5">brainrot enemy archetypes,</text>
    <text x="48" y="224" class="doodle-font" font-size="13.5">procedural wave spawning and</text>
    <text x="48" y="244" class="doodle-font" font-size="13.5">custom HLSL/GLSL shaders.</text>
    <text x="153" y="269" text-anchor="middle" class="tag-text">C# / Unity / HLSL / GLSL</text>
  </g>

  <!-- Card 2: Munchbox -->
  <g transform="rotate(0.8 487.0 192.0)">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.080;0.160;0.92;0.97;1" dur="10s" repeatCount="indefinite"/>
    <g filter="url(#doodle)">
      <rect x="342" y="92" width="290" height="200" rx="12" fill="#fff" stroke="#3b2f2f" stroke-width="2.5"/>
      <rect x="342" y="92" width="290" height="44" rx="12" fill="#3f7fbf" stroke="#3b2f2f" stroke-width="2.5"/>
      <rect x="342" y="92" width="290" height="44" rx="12" fill="url(#hatch)"/>
      <rect x="356" y="252" width="224" height="26" rx="13" fill="#3f7fbf" fill-opacity="0.2" stroke="#3b2f2f" stroke-width="2"/>
    </g>
    <text x="356" y="120" font-size="18.5" class="card-title">Munchbox</text>
    <text x="620" y="120" text-anchor="end" class="scene-label">SCENE 02</text>
    <text x="356" y="158" class="doodle-font" font-size="13" opacity="0.68">stock, but smarter</text>
    <text x="356" y="184" class="doodle-font" font-size="13.5">AI restaurant inventory engine:</text>
    <text x="356" y="204" class="doodle-font" font-size="13.5">Bayesian structural time series</text>
    <text x="356" y="224" class="doodle-font" font-size="13.5">forecasting, bill of materials</text>
    <text x="356" y="244" class="doodle-font" font-size="13.5">conversion, custom dashboards.</text>
    <text x="468" y="269" text-anchor="middle" class="tag-text">Python / BSTS / SQL / D3.js</text>
  </g>

  <!-- Card 3: SportLink -->
  <g transform="rotate(-0.6 795.0 192.0)">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.130;0.210;0.92;0.97;1" dur="10s" repeatCount="indefinite"/>
    <g filter="url(#doodle)">
      <rect x="650" y="92" width="290" height="200" rx="12" fill="#fff" stroke="#3b2f2f" stroke-width="2.5"/>
      <rect x="650" y="92" width="290" height="44" rx="12" fill="#3f9a6a" stroke="#3b2f2f" stroke-width="2.5"/>
      <rect x="650" y="92" width="290" height="44" rx="12" fill="url(#hatch)"/>
      <rect x="664" y="252" width="228" height="26" rx="13" fill="#3f9a6a" fill-opacity="0.2" stroke="#3b2f2f" stroke-width="2"/>
    </g>
    <text x="664" y="120" font-size="18.5" class="card-title">SportLink</text>
    <text x="928" y="120" text-anchor="end" class="scene-label">SCENE 03</text>
    <text x="664" y="158" class="doodle-font" font-size="13" opacity="0.68">zero-downtime stack</text>
    <text x="664" y="184" class="doodle-font" font-size="13.5">Containerized multi-service sports</text>
    <text x="664" y="204" class="doodle-font" font-size="13.5">platform on cloud infra with</text>
    <text x="664" y="224" class="doodle-font" font-size="13.5">GitHub Actions CI/CD and</text>
    <text x="664" y="244" class="doodle-font" font-size="13.5">reverse proxy routing.</text>
    <text x="778" y="269" text-anchor="middle" class="tag-text">TypeScript / Docker / Caddy</text>
  </g>

  <!-- Card 4: Virtual Paddock -->
  <g transform="rotate(0.9 179.0 410.0)">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.180;0.260;0.92;0.97;1" dur="10s" repeatCount="indefinite"/>
    <g filter="url(#doodle)">
      <rect x="34" y="310" width="290" height="200" rx="12" fill="#fff" stroke="#3b2f2f" stroke-width="2.5"/>
      <rect x="34" y="310" width="290" height="44" rx="12" fill="#2f9aa8" stroke="#3b2f2f" stroke-width="2.5"/>
      <rect x="34" y="310" width="290" height="44" rx="12" fill="url(#hatch)"/>
      <rect x="48" y="470" width="214" height="26" rx="13" fill="#2f9aa8" fill-opacity="0.2" stroke="#3b2f2f" stroke-width="2"/>
    </g>
    <text x="48" y="338" font-size="18.5" class="card-title">Virtual Paddock</text>
    <text x="312" y="338" text-anchor="end" class="scene-label">SCENE 04</text>
    <text x="48" y="376" class="doodle-font" font-size="13" opacity="0.68">endurance racing sim</text>
    <text x="48" y="402" class="doodle-font" font-size="13.5">Uma Musume Endurance Championship</text>
    <text x="48" y="422" class="doodle-font" font-size="13.5">web simulator: driver ratings,</text>
    <text x="48" y="442" class="doodle-font" font-size="13.5">knockout qualifying and grid</text>
    <text x="48" y="462" class="doodle-font" font-size="13.5">penalties deployed on Vercel.</text>
    <text x="155" y="487" text-anchor="middle" class="tag-text">TypeScript / React / Vite</text>
  </g>

  <!-- Card 5: HidMark -->
  <g transform="rotate(-0.8 487.0 410.0)">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.230;0.310;0.92;0.97;1" dur="10s" repeatCount="indefinite"/>
    <g filter="url(#doodle)">
      <rect x="342" y="310" width="290" height="200" rx="12" fill="#fff" stroke="#3b2f2f" stroke-width="2.5"/>
      <rect x="342" y="310" width="290" height="44" rx="12" fill="#b89a2e" stroke="#3b2f2f" stroke-width="2.5"/>
      <rect x="342" y="310" width="290" height="44" rx="12" fill="url(#hatch)"/>
      <rect x="356" y="470" width="190" height="26" rx="13" fill="#b89a2e" fill-opacity="0.2" stroke="#3b2f2f" stroke-width="2"/>
    </g>
    <text x="356" y="338" font-size="18.5" class="card-title">HidMark</text>
    <text x="620" y="338" text-anchor="end" class="scene-label">SCENE 05</text>
    <text x="356" y="376" class="doodle-font" font-size="13" opacity="0.68">invisible ink for pixels</text>
    <text x="356" y="402" class="doodle-font" font-size="13.5">Native macOS utility with a Rust</text>
    <text x="356" y="422" class="doodle-font" font-size="13.5">core: steganographic watermarks,</text>
    <text x="356" y="442" class="doodle-font" font-size="13.5">luma key embedding and AI</text>
    <text x="356" y="462" class="doodle-font" font-size="13.5">synthetic artifact detection.</text>
    <text x="451" y="487" text-anchor="middle" class="tag-text">Swift / SwiftUI / Rust</text>
  </g>

  <!-- Card 6: Multi-Agent Orchestrator -->
  <g transform="rotate(1.1 795.0 410.0)">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.280;0.360;0.92;0.97;1" dur="10s" repeatCount="indefinite"/>
    <g filter="url(#doodle)">
      <rect x="650" y="310" width="290" height="200" rx="12" fill="#fff" stroke="#3b2f2f" stroke-width="2.5"/>
      <rect x="650" y="310" width="290" height="44" rx="12" fill="#7a5bb5" stroke="#3b2f2f" stroke-width="2.5"/>
      <rect x="650" y="310" width="290" height="44" rx="12" fill="url(#hatch)"/>
      <rect x="664" y="470" width="216" height="26" rx="13" fill="#7a5bb5" fill-opacity="0.2" stroke="#3b2f2f" stroke-width="2"/>
    </g>
    <text x="664" y="338" font-size="15" class="card-title">Multi-Agent Orchestrator</text>
    <text x="928" y="338" text-anchor="end" class="scene-label">SCENE 06</text>
    <text x="664" y="376" class="doodle-font" font-size="13" opacity="0.68">design doc in, game out</text>
    <text x="664" y="402" class="doodle-font" font-size="13.5">Open-source pipeline: local Qwen</text>
    <text x="664" y="422" class="doodle-font" font-size="13.5">and OpenCode parse GDDs,</text>
    <text x="664" y="442" class="doodle-font" font-size="13.5">write C# and automate</text>
    <text x="664" y="462" class="doodle-font" font-size="13.5">procedural Blender modeling.</text>
    <text x="772" y="487" text-anchor="middle" class="tag-text">Python / C# / Blender API</text>
  </g>
</svg>
