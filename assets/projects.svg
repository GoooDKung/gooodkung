<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" role="img" aria-label="Goood featured projects">
  <title>Goood featured projects</title>
  <defs>
    <style>
      .doodle-font {
        font-family: 'Bradley Hand', 'Chalkboard SE', 'Marker Felt', 'Segoe Print', 'Comic Sans MS', cursive, sans-serif;
        fill: #3b2f2f;
      }
    </style>
    <filter id="doodle" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="2" result="n">
        <animate attributeName="seed" values="2;5;9;4;7" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#3b2f2f" stroke-opacity="0.28" stroke-width="2"/>
    </pattern>
  </defs>

  <rect x="2" y="2" width="976" height="536" rx="18" fill="#fbf6ea" stroke="#3b2f2f" stroke-width="2.5" filter="url(#doodle)"/>
  <text x="34" y="46" class="doodle-font" font-size="26" font-weight="700">now showing</text>
  <text x="34" y="68" class="doodle-font" font-size="14" opacity="0.7">six features currently in production</text>

  <g filter="url(#doodle)" class="doodle-font">
    <!-- Card 1: Aberration -->
    <g transform="rotate(-1.2 179.0 192.0)">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.030;0.110;0.92;0.97;1" dur="10s" repeatCount="indefinite"/>
      <rect x="34" y="92" width="290" height="200" rx="12" fill="#fff" stroke="#3b2f2f" stroke-width="2.5"/>
      <rect x="34" y="92" width="290" height="44" rx="12" fill="#e07a3f" stroke="#3b2f2f" stroke-width="2.5"/>
      <rect x="34" y="92" width="290" height="44" rx="12" fill="url(#hatch)"/>
      <text x="48" y="121" font-size="19" font-weight="700" fill="#fff" stroke="#3b2f2f" stroke-width="0.6">Aberration</text>
      <text x="312" y="121" text-anchor="end" font-size="11" fill="#fff" opacity="0.9">SCENE 01</text>
      <text x="48" y="158" font-size="13" opacity="0.65">BoomerMcShooter</text>
      <text x="48" y="184" font-size="14">Underground boomer shooter with</text>
      <text x="48" y="204" font-size="14">brainrot enemy archetypes,</text>
      <text x="48" y="224" font-size="14">procedural wave spawning and</text>
      <text x="48" y="244" font-size="14">custom HLSL/GLSL shaders.</text>
      <rect x="48" y="252" width="191" height="26" rx="13" fill="#e07a3f" fill-opacity="0.2" stroke="#3b2f2f" stroke-width="2"/>
      <text x="57" y="270" font-size="13">C# / Unity / HLSL / GLSL</text>
    </g>

    <!-- Card 2: Munchbox -->
    <g transform="rotate(0.8 487.0 192.0)">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.080;0.160;0.92;0.97;1" dur="10s" repeatCount="indefinite"/>
      <rect x="342" y="92" width="290" height="200" rx="12" fill="#fff" stroke="#3b2f2f" stroke-width="2.5"/>
      <rect x="342" y="92" width="290" height="44" rx="12" fill="#3f7fbf" stroke="#3b2f2f" stroke-width="2.5"/>
      <rect x="342" y="92" width="290" height="44" rx="12" fill="url(#hatch)"/>
      <text x="356" y="121" font-size="19" font-weight="700" fill="#fff" stroke="#3b2f2f" stroke-width="0.6">Munchbox</text>
      <text x="620" y="121" text-anchor="end" font-size="11" fill="#fff" opacity="0.9">SCENE 02</text>
      <text x="356" y="158" font-size="13" opacity="0.65">stock, but smarter</text>
      <text x="356" y="184" font-size="14">AI restaurant inventory engine:</text>
      <text x="356" y="204" font-size="14">Bayesian structural time series</text>
      <text x="356" y="224" font-size="14">forecasting, bill of materials</text>
      <text x="356" y="244" font-size="14">conversion, custom dashboards.</text>
      <rect x="356" y="252" width="206" height="26" rx="13" fill="#3f7fbf" fill-opacity="0.2" stroke="#3b2f2f" stroke-width="2"/>
      <text x="365" y="270" font-size="13">Python / BSTS / SQL / D3.js</text>
    </g>

    <!-- Card 3: SportLink -->
    <g transform="rotate(-0.6 795.0 192.0)">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.130;0.210;0.92;0.97;1" dur="10s" repeatCount="indefinite"/>
      <rect x="650" y="92" width="290" height="200" rx="12" fill="#fff" stroke="#3b2f2f" stroke-width="2.5"/>
      <rect x="650" y="92" width="290" height="44" rx="12" fill="#3f9a6a" stroke="#3b2f2f" stroke-width="2.5"/>
      <rect x="650" y="92" width="290" height="44" rx="12" fill="url(#hatch)"/>
      <text x="664" y="121" font-size="19" font-weight="700" fill="#fff" stroke="#3b2f2f" stroke-width="0.6">SportLink</text>
      <text x="928" y="121" text-anchor="end" font-size="11" fill="#fff" opacity="0.9">SCENE 03</text>
      <text x="664" y="158" font-size="13" opacity="0.65">zero-downtime stack</text>
      <text x="664" y="184" font-size="14">Containerized multi-service sports</text>
      <text x="664" y="204" font-size="14">platform on cloud infra with</text>
      <text x="664" y="224" font-size="14">GitHub Actions CI/CD and</text>
      <text x="664" y="244" font-size="14">reverse proxy routing.</text>
      <rect x="664" y="252" width="212" height="26" rx="13" fill="#3f9a6a" fill-opacity="0.2" stroke="#3b2f2f" stroke-width="2"/>
      <text x="673" y="270" font-size="13">TypeScript / Docker / Caddy</text>
    </g>

    <!-- Card 4: Virtual Paddock -->
    <g transform="rotate(0.9 179.0 410.0)">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.180;0.260;0.92;0.97;1" dur="10s" repeatCount="indefinite"/>
      <rect x="34" y="310" width="290" height="200" rx="12" fill="#fff" stroke="#3b2f2f" stroke-width="2.5"/>
      <rect x="34" y="310" width="290" height="44" rx="12" fill="#2f9aa8" stroke="#3b2f2f" stroke-width="2.5"/>
      <rect x="34" y="310" width="290" height="44" rx="12" fill="url(#hatch)"/>
      <text x="48" y="339" font-size="19" font-weight="700" fill="#fff" stroke="#3b2f2f" stroke-width="0.6">Virtual Paddock</text>
      <text x="312" y="339" text-anchor="end" font-size="11" fill="#fff" opacity="0.9">SCENE 04</text>
      <text x="48" y="376" font-size="13" opacity="0.65">endurance racing sim</text>
      <text x="48" y="402" font-size="14">Uma Musume Endurance Championship</text>
      <text x="48" y="422" font-size="14">web simulator: driver ratings,</text>
      <text x="48" y="442" font-size="14">knockout qualifying and grid</text>
      <text x="48" y="462" font-size="14">penalties deployed on Vercel.</text>
      <rect x="48" y="470" width="198" height="26" rx="13" fill="#2f9aa8" fill-opacity="0.2" stroke="#3b2f2f" stroke-width="2"/>
      <text x="57" y="488" font-size="13">TypeScript / React / Vite</text>
    </g>

    <!-- Card 5: HidMark -->
    <g transform="rotate(-0.8 487.0 410.0)">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.230;0.310;0.92;0.97;1" dur="10s" repeatCount="indefinite"/>
      <rect x="342" y="310" width="290" height="200" rx="12" fill="#fff" stroke="#3b2f2f" stroke-width="2.5"/>
      <rect x="342" y="310" width="290" height="44" rx="12" fill="#b89a2e" stroke="#3b2f2f" stroke-width="2.5"/>
      <rect x="342" y="310" width="290" height="44" rx="12" fill="url(#hatch)"/>
      <text x="356" y="339" font-size="19" font-weight="700" fill="#fff" stroke="#3b2f2f" stroke-width="0.6">HidMark</text>
      <text x="620" y="339" text-anchor="end" font-size="11" fill="#fff" opacity="0.9">SCENE 05</text>
      <text x="356" y="376" font-size="13" opacity="0.65">invisible ink for pixels</text>
      <text x="356" y="402" font-size="14">Native macOS utility with a Rust</text>
      <text x="356" y="422" font-size="14">core: steganographic watermarks,</text>
      <text x="356" y="442" font-size="14">luma key embedding and AI</text>
      <text x="356" y="462" font-size="14">synthetic artifact detection.</text>
      <rect x="356" y="470" width="176" height="26" rx="13" fill="#b89a2e" fill-opacity="0.2" stroke="#3b2f2f" stroke-width="2"/>
      <text x="365" y="488" font-size="13">Swift / SwiftUI / Rust</text>
    </g>

    <!-- Card 6: Multi-Agent Orchestrator -->
    <g transform="rotate(1.1 795.0 410.0)">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.280;0.360;0.92;0.97;1" dur="10s" repeatCount="indefinite"/>
      <rect x="650" y="310" width="290" height="200" rx="12" fill="#fff" stroke="#3b2f2f" stroke-width="2.5"/>
      <rect x="650" y="310" width="290" height="44" rx="12" fill="#7a5bb5" stroke="#3b2f2f" stroke-width="2.5"/>
      <rect x="650" y="310" width="290" height="44" rx="12" fill="url(#hatch)"/>
      <text x="664" y="339" font-size="16" font-weight="700" fill="#fff" stroke="#3b2f2f" stroke-width="0.6">Multi-Agent Orchestrator</text>
      <text x="928" y="339" text-anchor="end" font-size="11" fill="#fff" opacity="0.9">SCENE 06</text>
      <text x="664" y="376" font-size="13" opacity="0.65">design doc in, game out</text>
      <text x="664" y="402" font-size="14">Open-source pipeline: local Qwen</text>
      <text x="664" y="422" font-size="14">and OpenCode parse GDDs,</text>
      <text x="664" y="442" font-size="14">write C# and automate</text>
      <text x="664" y="462" font-size="14">procedural Blender modeling.</text>
      <rect x="664" y="470" width="198" height="26" rx="13" fill="#7a5bb5" fill-opacity="0.2" stroke="#3b2f2f" stroke-width="2"/>
      <text x="673" y="488" font-size="13">Python / C# / Blender API</text>
    </g>
  </g>
</svg>
